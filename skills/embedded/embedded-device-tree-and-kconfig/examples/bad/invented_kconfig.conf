# intentionally incorrect: CONFIG_ST7789 is not a Zephyr symbol. The real
# driver symbol is CONFIG_ST7789V and it exists only when the devicetree has a
# "sitronix,st7789v" node (DT_HAS_SITRONIX_ST7789V_ENABLED). This line is a
# silent no-op: the build succeeds and the display driver stays disabled.
CONFIG_ST7789=y

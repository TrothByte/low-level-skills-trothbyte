name: Stale
on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 90
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: bug,enhancement,good first issue
          exempt-pr-labels: bug,enhancement
          stale-issue-message: >
            This issue has been inactive for 90 days. If it is still relevant, please
            comment to keep it open; otherwise it will be closed in 14 days.
          stale-pr-message: >
            This pull request has been inactive for 90 days. If it is still in progress,
            please comment to keep it open; otherwise it will be closed in 14 days.

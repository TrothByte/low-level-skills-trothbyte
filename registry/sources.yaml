# Primary Source Registry — реестр нормативных и авторитетных источников
# Приоритет: (1) стандарты/спецификации, (2) архитектурные мануалы, (3) языковые референсы,
# (4) официальная документация компиляторов, (5) документация ОС/ядра, (6) ABI-спеки,
# (7) CWE/security, (8) качественные вторичные источники.
# authority: normative | official | authoritative | secondary
# license: указывается для цитирования; стандарты-черновики обычно "freely redistributable draft".

meta:
  updated: 2026-08-14
  rule: "Вторичные репозитории используются для поиска пробелов, НЕ как единственный технический authority нормативных утверждений."


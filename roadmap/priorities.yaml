# Priorities — scoring и ранжирование skills
# Оценка по 5-балльной шкале. Формула: HIGH VALUE = важная проблема + слабое покрытие +
# сильные источники + сильная верификация + значимый failure mode агента.

meta:
  updated: 2026-08-14
  rubric:
    uniqueness: "5 = практически отсутствует, 1 = хорошо покрыто"
    agent_failure_importance: "5 = критичный систематический сбой агента, 1 = редкий"
    coverage_gap: "5 = нигде не покрыто, 1 = покрыто глубоко"
    technical_depth: "5 = глубокий cross-layer reasoning, 1 = поверхностный справочник"
    verification_strength: "5 = сильная исполнимая верификация, 1 = нет верификации"
    practical_value: "5 = ежедневная польза, 1 = нишевый"
    source_quality: "5 = нормативный primary source, 1 = вторичный/ненадёжный"
    maintenance_cost: "LOW/MEDIUM/HIGH (обратная метрика: ниже лучше)"
    token_efficiency: "5 = компактное ядро + прогрессивное раскрытие, 1 = раздутое"
  weight_note: "Упорядочение учитывает приоритетно: uniqueness + coverage_gap + agent_failure_importance + verification_strength."


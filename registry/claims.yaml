# Claims / Provenance Registry — traceability нормативных утверждений
# Модель: claim → source → section → skill. Позволяет автоматически проверять provenance.
# Каждое НОРМАТИВНОЕ или критически важное утверждение должно быть traceable.

meta:
  updated: 2026-08-14
  rule: "Нормативное утверждение без source-reference недопустимо в stable skill."
  confidence:
    MUST_VERIFY: "требует исполнимой проверки (см. verification method)"
    MUST_CONSIDER: "необходимо учитывать при reasoning, проверка контекстная"
    OPTIONAL: "справочная информация"
  evidence_levels: ["KNOWN (source-backed)", "INFERRED (выведено из source)", "UNVERIFIED (нуждается в проверке)"]

# ============================================================
# Примеры core claims (расширяется при реализации skills)
# ============================================================

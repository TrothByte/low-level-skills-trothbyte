# Ключ: depth = 0 (нет) .. 5 (глубоко). priority = high/medium/low.
# Источник данных: research-ingestion.yaml, Анализ скиллов.md, Энциклопедия.

meta:
  purpose: "Широкая карта низкоуровневой инженерии: существующее покрытие, глубина, пробелы, приоритеты, источники, потенциальные skills."
  updated: 2026-08-14
  legend:
    depth: "0=отсутствует, 1=упоминание, 2=обзор, 3=учебно-практическая, 4=глубокая, 5=эталонная"
    existing: "none / partial / good / strong"


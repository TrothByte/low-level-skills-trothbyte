provenance_checks:
- Каждый claim в stable skill должен иметь непустой source и section
- source id должен существовать в registry/sources.yaml
- section должен быть реальным (не выдуманным)
- 'evidence: KNOWN только если источник нормативный/официальный'
- UNVERIFIED claims запрещены в stable skill — только в draft/researched
- 'Различать: direct quotation (цитата) vs paraphrase (пересказ) vs inspiration (идея) — хранить в provenance'

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validators
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run validators
        run: python tools/validate.py

      - name: Check generated catalog is up to date
        run: |
          python tools/reports/gen_skills_catalog.py
          git diff --exit-code docs/SKILLS.md || { echo "::error::docs/SKILLS.md is stale — run tools/reports/gen_skills_catalog.py"; exit 1; }

      - name: Check landing data is up to date
        run: |
          python tools/reports/gen_landing_data.py
          git diff --exit-code docs/assets/skills.js || { echo "::error::docs/assets/skills.js is stale — run tools/reports/gen_landing_data.py"; exit 1; }

  compile-c-examples:
    name: Compile C examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile C examples
        run: |
          echo "Compiling C source files in skills/**/examples/good/**/*.c"
          C_FILES=$(find skills -path "*/examples/good/*.c" 2>/dev/null)

          if [ -z "$C_FILES" ]; then
            echo "No C example files found."
            exit 0
          fi

          echo "Found C files:"
          echo "$C_FILES"
          echo ""

          FAILED=0
          for f in $C_FILES; do
            echo "Compiling: $f"
            if gcc -Wall -Wextra -Werror -c -o /dev/null "$f"; then
              echo "  OK"
            else
              echo "  FAILED"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more C examples failed to compile."
            exit 1
          fi

          echo ""
          echo "All C examples compiled successfully."

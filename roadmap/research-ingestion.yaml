# ============================================================
# FAILURE-MODE INVENTORY (Категория B — поведенческие паттерны агентов)
# Источник: Анализ скиллов.md Этап 5, Категория B. Нумерация соответствует источнику.
# ============================================================
failure_modes:
  compiler_and_safety:
    - {id: B1, name: "adds unsafe/unwrap/clone/#[allow] at first compile error instead of fixing root cause", source: "trailofbits rust-review; expert"}
    - {id: B2, name: "'it compiles therefore correct' — borrow checker proves nothing about unsafe/panic/deadlock/memory-ordering/FFI ABI", source: "rust-review Rationalizations to Reject (verbatim quote)"}
    - {id: B3, name: "// SAFETY: comment used as infallibility claim, not as invariant documentation", source: "rust-review"}
    - {id: B4, name: "'unsafe is rare → skip memory-safety cluster' instead of setting has_unsafe flag honestly", source: "rust-review"}
    - {id: B5, name: "only accepts compiler/linter errors; never runs sanitizers/fuzzers on C/C++", source: "testing-handbook-skills; Perry et al. CCS'23 arXiv:2211.03622; Z3 memory-safety"}
  process_and_quality:
    - {id: B6, name: "confident tone on wrong answer; invents API/behavior, does not mark uncertainty", source: "Perry et al.; CyberSecEval arXiv:2312.04724"}
    - {id: B7, name: "does not ask clarifying questions; silently picks an interpretation", source: "ask-questions-if-underspecified; karpathy-guidelines; zhinkgit"}
    - {id: B8, name: "overengineering: abstractions for single-use code, impossible-error handling", source: "karpathy-guidelines"}
    - {id: B9, name: "non-surgical edits: improves neighboring code, refactors non-broken code, breaks style", source: "karpathy-guidelines 'Touch only what you must'"}
    - {id: B10, name: "hides partial result behind 'successful' report (partial run → REPORT.md as if complete)", source: "trailofbits c-review/rust-review; CSS-Electronics verify-as-gate"}
    - {id: B11, name: "re-derives plan/prompts inline instead of running canonical planner", source: "trailofbits"}
    - {id: B12, name: "wrong tool parallelism (background spawns do NOT parallelize)", source: "trailofbits"}
    - {id: B13, name: "fails to re-check ownership/lifetime after own refactor; breaks implicit contract elsewhere", source: "expert; karpathy surgical changes"}
    - {id: B14, name: "confuses similar API signatures across versions (tokio 0.2 vs 1.x, snprintf vs _snprintf)", source: "expert; rust-review static-hygiene"}
    - {id: B15, name: "transfers pattern across languages where it does not apply (C free in Rust, Go channels in C++)", source: "expert; c-review cpp-semantics"}
    - {id: B16, name: "loses ownership context in long file/call chain (pointer to local, reference to temporary)", source: "expert; c-review UAF"}
    - {id: B17, name: "no measurable success criterion ('make it work') → cannot self-verify", source: "karpathy-guidelines"}
    - {id: B18, name: "reports completed on partial result (hard-cap truncated worker)", source: "trailofbits"}
